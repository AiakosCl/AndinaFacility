    <style>
        body {
            background-color: #F5F5F7;
            background-image:

            background-position: center;
            background-attachment: fixed;

        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

<body class="min-h-screen text-[#1D1D1F] overflow-x-hidden selection:bg-[#0066CC] selection:text-white flex flex-col font-['Inter'] items-center justify-center">
    
    <div class="glass-card rounded-2xl p-10 flex flex-col items-center justify-center text-center max-w-md w-full mx-5">
        <div class="w-20 h-20 rounded-full bg-red-100 flex items-center justify-center mb-6">
            <span class="material-symbols-outlined text-red-500 text-4xl" style="font-variation-settings: 'FILL' 1;">wifi_off</span>
        </div>
        <h1 class="text-3xl font-bold mb-4 tracking-tight">Estás desconectado</h1>
        <p class="text-gray-600 mb-8 text-lg">Parece que no tienes conexión a internet en este momento. Se requiere conexión para acceder a esta herramienta.</p>
        
        <a href="./index.html" class="bg-[#0066CC] hover:bg-[#005cba] text-white font-medium py-3 px-6 rounded-lg transition-colors w-full flex justify-center items-center gap-2">
